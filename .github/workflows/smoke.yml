name: epsilon-MOBO demo smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_demo.py --problems KNO1 --methods eps-qpots eps-tsemo eps-ucb parego greedy-mean greedy-std greedy-ms --criteria HVC --modes PFexp --repetitions 1 --q 1 --total-evals 22 --population 12 --generations 2 --output-root "$RUNNER_TEMP/epsilon-mobo"
      - run: python run_demo.py --summary-only --output-root "$RUNNER_TEMP/epsilon-mobo"
